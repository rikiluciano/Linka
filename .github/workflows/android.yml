name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Give APK a stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk linka.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: linka.apk
          path: linka.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK artifact
        uses: actions/download-artifact@v7
        with:
          name: linka.apk
          path: dist
      - name: Publish release and attach APK
        uses: softprops/action-gh-release@v3
        with:
          name: Linka ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/linka.apk
